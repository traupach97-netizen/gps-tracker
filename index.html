
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GPS Tracker</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        #map {
            height: 80vh;
            width: 100%;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
        }

        #downloadButton {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            background-color: #2196F3;
            color: white;
            border: none;
            cursor: pointer;
        }

        #downloadButton:active {
            background-color: #1976D2;
        }
    </style>
</head>

<body>

    <h1>Mein GPS Tracker</h1>

    <div id="map"></div>

    <!-- Button zum Herunterladen -->
    <button id="downloadButton">
        Strecke als CSV speichern
    </button>


    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>

        // Karte erstellen
        const map = L.map("map");

        // Kartenanbieter
        L.tileLayer("https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png", {
            attribution: "&copy; OpenStreetMap France"
        }).addTo(map);


        // GPS-Punkte für die Linie
        const route = [];

        // GPS-Daten für die CSV
        const gpsData = [];


        // Blaue Linie erstellen
        const line = L.polyline(route, {
            color: "blue",
            weight: 5
        }).addTo(map);


        // Marker für aktuelle Position
        let marker = null;


        // GPS starten
        navigator.geolocation.watchPosition(

            function(position) {

                // GPS-Koordinaten
                const latitude = position.coords.latitude;
                const longitude = position.coords.longitude;

                // Zeit speichern
                const timestamp = new Date().toISOString();


                // Punkt für die Karte speichern
                route.push([latitude, longitude]);

                // Linie aktualisieren
                line.setLatLngs(route);


                // Daten für CSV speichern
                gpsData.push({
                    timestamp: timestamp,
                    longitude: longitude,
                    latitude: latitude
                });


                // Marker erstellen oder verschieben
                if (marker === null) {

                    marker = L.marker([latitude, longitude])
                        .addTo(map)
                        .bindPopup("Du bist hier!");

                } else {

                    marker.setLatLng([latitude, longitude]);

                }


                // Karte auf aktuelle Position bewegen
                map.setView([latitude, longitude], 16);

            },


            function(error) {

                alert("GPS Fehler: " + error.message);

            }

        );


        // CSV herunterladen
        document.getElementById("downloadButton").addEventListener("click", function() {

            // CSV-Kopfzeile
            let csv = "timestamp,longitude,latitude\n";


            // Jeden GPS-Punkt hinzufügen
            gpsData.forEach(function(point) {

                csv += point.timestamp + ","
                    + point.longitude + ","
                    + point.latitude + "\n";

            });


            // CSV-Datei erstellen
            const blob = new Blob([csv], {
                type: "text/csv;charset=utf-8;"
            });


            // Download-Link erstellen
            const url = URL.createObjectURL(blob);

            const link = document.createElement("a");

            link.href = url;
            link.download = "gps-strecke.csv";

            link.click();


            // Speicher wieder freigeben
            URL.revokeObjectURL(url);

        });

    </script>

</body>
</html>
