
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GPS Tracker</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        #map {
            height: 80vh;
            width: 100%;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>Mein GPS Tracker</h1>

    <div id="map"></div>

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    ```html
<script>

    // Karte erstellen
    const map = L.map("map");

    // Kartenanbieter
    L.tileLayer("https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap France"
    }).addTo(map);


    // Alle GPS-Punkte werden hier gespeichert
    const route = [];

    // Blaue Linie
    const line = L.polyline(route, {
        color: "blue",
        weight: 5
    }).addTo(map);


    // Marker für die aktuelle Position
    let marker = null;


    // GPS starten
    navigator.geolocation.watchPosition(

        function(position) {

            // GPS-Koordinaten
            const latitude = position.coords.latitude;
            const longitude = position.coords.longitude;

            // Neue Position speichern
            route.push([latitude, longitude]);

            // Linie aktualisieren
            line.setLatLngs(route);


            // Wenn es noch keinen Marker gibt
            if (marker === null) {

                // Marker erstellen
                marker = L.marker([latitude, longitude])
                    .addTo(map)
                    .bindPopup("Du bist hier!");

            } else {

                // Bestehenden Marker bewegen
                marker.setLatLng([latitude, longitude]);
            }


            // Karte auf aktuelle Position bewegen
            map.setView([latitude, longitude], 16);
        },


        function(error) {

            alert("GPS konnte nicht abgerufen werden.");

        }

    );

</script>
```


</body>
</html>
